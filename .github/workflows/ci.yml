name: CrownPath CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  owner-access:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crownpath
          POSTGRES_PASSWORD: crownpath_ci_password
          POSTGRES_DB: crownpath_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crownpath -d crownpath_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CROWNPATH_LEARNER_ACCESS_APPROVED: 'false'
      CROWNPATH_LEARNER_ENROLLMENT_APPROVED: 'false'
      CROWNPATH_INSTRUCTOR_ACCESS_APPROVED: 'false'
      CROWNPATH_OWNER_LAUNCH_APPROVED: 'false'
      PYTHONPATH: ${{ github.workspace }}
      CROWNPATH_ENV: staging
      CROWNPATH_SECRET_KEY: ci-only-secret-key-for-crownpath-tests-2026
      CROWNPATH_DATABASE_URL: postgresql+psycopg://crownpath:crownpath_ci_password@localhost:5432/crownpath_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        run: python -m compileall crownpath api
      - name: Run tests
        run: python -m pytest -q tests/test_owner_only_access.py
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crownpath
          POSTGRES_PASSWORD: crownpath_ci_password
          POSTGRES_DB: crownpath_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crownpath -d crownpath_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CROWNPATH_LEARNER_ACCESS_APPROVED: 'true'
      CROWNPATH_LEARNER_ENROLLMENT_APPROVED: 'true'
      CROWNPATH_INSTRUCTOR_ACCESS_APPROVED: 'true'
      CROWNPATH_OWNER_LAUNCH_APPROVED: 'false'
      PYTHONPATH: ${{ github.workspace }}
      CROWNPATH_ENV: staging
      CROWNPATH_SECRET_KEY: ci-only-secret-key-for-crownpath-tests-2026
      CROWNPATH_DATABASE_URL: postgresql+psycopg://crownpath:crownpath_ci_password@localhost:5432/crownpath_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        run: python -m compileall crownpath api
      - name: Run tests
        run: |
          python -m pytest -q tests --ignore=tests/test_owner_only_access.py --ignore=tests/test_postgres_curriculum_migration_integration.py --junitxml="$RUNNER_TEMP/application-results.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "application-results.xml")).getroot()
          required = {
              "test_mfa_enrollment_rotation_does_not_emit_logout_audit",
              "test_setup_cannot_reset_already_enabled_mfa",
          }
          cases = [case for case in root.findall(".//testcase") if
                   case.get("name") in required and
                   case.get("classname", "").endswith("MfaIntegrationTest")]
          assert {case.get("name") for case in cases} == required, "MFA regressions were not collected"
          assert len(cases) == 2
          assert not any(case.find(tag) is not None for case in cases
                         for tag in ("skipped", "failure", "error"))
          print("MFA rotation-audit and enabled-setup regressions: executed, passed, no skips")
          PY
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crownpath
          POSTGRES_PASSWORD: crownpath_ci_password
          POSTGRES_DB: crownpath_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crownpath -d crownpath_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CROWNPATH_LEARNER_ACCESS_APPROVED: 'false'
      CROWNPATH_LEARNER_ENROLLMENT_APPROVED: 'false'
      CROWNPATH_INSTRUCTOR_ACCESS_APPROVED: 'false'
      CROWNPATH_OWNER_LAUNCH_APPROVED: 'false'
      PYTHONPATH: ${{ github.workspace }}
      CROWNPATH_ENV: staging
      CROWNPATH_SECRET_KEY: ci-only-secret-key-for-crownpath-tests-2026
      CROWNPATH_DATABASE_URL: postgresql+psycopg://crownpath:crownpath_ci_password@localhost:5432/crownpath_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python
        run: python -m compileall crownpath api
      - name: Run tests
        run: python -m pytest -q tests/test_postgres_curriculum_migration_integration.py
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      CROWNPATH_ENV: staging
      CROWNPATH_OWNER_LAUNCH_APPROVED: "false"
      CROWNPATH_LEARNER_ACCESS_APPROVED: "false"
      CROWNPATH_LEARNER_ENROLLMENT_APPROVED: "false"
      CROWNPATH_INSTRUCTOR_ACCESS_APPROVED: "false"
      CROWNPATH_SECRET_KEY: ci-only-browser-smoke-key
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run isolated Chromium smoke test
        run: python -m pytest -q tests/test_owner_progress_browser_playwright.py

  postgres-atomic-logout:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic_logout
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: crownpath_disposable_logout_20261116
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synthetic_logout -d crownpath_disposable_logout_20261116"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONPATH: ${{ github.workspace }}
      CROWNPATH_ENV: staging
      CROWNPATH_OWNER_LAUNCH_APPROVED: 'false'
      CROWNPATH_TEST_DB_DISPOSABLE: 'YES'
      CROWNPATH_DATABASE_URL: "sqlite:///:memory:"
      CROWNPATH_ATOMIC_LOGOUT_POSTGRES_URL: postgresql+psycopg://synthetic_logout:disposable_ci_only@127.0.0.1:5432/crownpath_disposable_logout_20261116
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Verify isolated PostgreSQL logout rollback (must not skip)
        run: |
          python -m pytest -q -rs tests/test_payment_mfa_postgresql_atomic_logout.py tests/test_payment_mfa_postgres_logout_consume_race.py tests/test_payment_mfa_postgres_lock_timeout.py tests/test_logout_http_postgres_audit.py tests/test_mfa_postgres_stale_setup.py tests/test_payment_action_payload_postgres.py tests/test_payment_real_stepup_postgres.py tests/test_payment_one_use_challenge_postgres.py --junitxml="$RUNNER_TEMP/logout-postgres.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "logout-postgres.xml")).getroot()
          cases = root.findall(".//testcase")
          assert len(cases) == 43, "Expected forty-three PostgreSQL acceptance cases including one-use challenges"
          assert not root.findall(".//skipped"), "Skipped test is not acceptance proof"
          assert not root.findall(".//failure") and not root.findall(".//error")
          print("PostgreSQL logout rollback and session isolation: executed, passed, no skips")
          PY
